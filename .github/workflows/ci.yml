name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # shellcheck fails on non-ASCII characters if locale is plain C
  LC_ALL: C.UTF-8

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck -s sh
        run: |
          shellcheck --version
          shellcheck -s sh ts-update install.sh netinstall.sh \
            ts-update-bootcheck.init tests/run-tests.sh

      - name: syntax check (dash)
        run: |
          for f in ts-update install.sh netinstall.sh ts-update-bootcheck.init tests/run-tests.sh; do
            dash -n "$f" || exit 1
          done

      # netinstall.sh detects truncated downloads by end marker, so
      # it must remain on the last line.
      - name: EOF marker intact
        run: |
          for f in ts-update ts-update-bootcheck.init; do
            if [ "$(sed -n '$p' "$f")" != "# ts-update-eof" ]; then
              echo "$f: last line is not EOF marker" >&2
              exit 1
            fi
          done

  tests:
    name: tests (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dash = strict POSIX, busybox ash = same shell as OpenWrt
        shell: [dash, busybox]
    steps:
      - uses: actions/checkout@v4

      - name: install busybox
        if: matrix.shell == 'busybox'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox-static
          printf '#!/bin/sh\nexec busybox sh "$@"\n' | sudo tee /usr/local/bin/bbsh >/dev/null
          sudo chmod 755 /usr/local/bin/bbsh
          busybox sh -c 'echo busybox ash ok'

      - name: run test matrix
        timeout-minutes: 15
        run: |
          if [ "${{ matrix.shell }}" = busybox ]; then
            TS_SH=/usr/local/bin/bbsh ./tests/run-tests.sh
          else
            TS_SH=dash ./tests/run-tests.sh
          fi
